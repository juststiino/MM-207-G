<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create recipe</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="/public/manifest.json" />
  <link rel="icon" href="/public/icon-192.png" />
</head>
<body>
  <header class="site-header">
    <img src="./public/icon-192.png" alt="Recipe book logo" class="logo" />
    <h1>Recipe book</h1>
  </header>

  <nav class="navbar">
    <a href="/index.html" class="navButton">Home</a>
    <a href="/login.html" class="navButton">Login</a>
    <a href="/createRecipe.html" class="navButton">Create recipe</a>
    <a href="/myRecipe.html" class="navButton">My recipes</a>
  </nav>

  <main>
    <section class="card">
      <h2>New recipe</h2>

      <form id="recipeForm" class="edit-recipe-form">
        <label class="edit-recipe-field" for="title">
          <span class="edit-recipe-label">Title</span>
          <input type="text" id="title" required />
        </label>

        <label class="edit-recipe-field" for="imageUrl">
          <span class="edit-recipe-label">Image URL</span>
          <input
            type="url"
            id="imageUrl"
            placeholder="https://example.com/recipe.jpg"
          />
        </label>

        <label class="edit-recipe-field" for="ingredients">
          <span class="edit-recipe-label">Ingredients</span>
          <textarea
            id="ingredients"
            required
            placeholder="Write one ingredient per line. You do not need to use - or numbering."
          ></textarea>
        </label>

        <label class="edit-recipe-field" for="steps">
          <span class="edit-recipe-label">Steps</span>
          <textarea
            id="steps"
            required
            placeholder="Write one step per line. You do not need to use 1., 2. or -."
          ></textarea>
        </label>

        <label class="edit-recipe-field" for="tags">
          <span class="edit-recipe-label">Tags</span>
          <input
            type="text"
            id="tags"
            placeholder="dinner, italian, quick"
          />
        </label>
        <p class="hint" id="tagsHelp">Add tags to make the recipe easier to find.</p>

        <label class="edit-recipe-field" for="servings">
          <span class="edit-recipe-label">Servings</span>
          <input type="number" id="servings" min="1" step="1" />
        </label>

        <label class="edit-recipe-field" for="timeMinutes">
          <span class="edit-recipe-label">Time in minutes</span>
          <input type="number" id="timeMinutes" min="1" step="1" />
        </label>

        <label class="inline">
          <input type="checkbox" id="isPrivate" />
          <span>Private recipe</span>
        </label>

        <button type="submit" class="primary">Save recipe</button>
        <p id="msg"></p>
      </form>
    </section>
  </main>

  <script type="module" src="./src/ui/createRecipe.js"></script>
</body>
</html>
