<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create recipe</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="/public/manifest.json" />
  <link rel="icon" href="/public/icon-192.png" />
</head>
<body>
  <header class="site-header">
    <img src="/public/icon-192.png" class="logo" alt="Logo" />
    <h1>Create recipe</h1>
  </header>

  <nav class="navbar">
    <a href="/index.html" class="navButton">Home</a>
    <a href="/login.html" class="navButton">Login</a>
    <a href="/createRecipe.html" class="navButton">Create recipe</a>
    <a href="/myRecipe.html" class="navButton">My recipes</a>
  </nav>

  <main>
    <section class="card">
      <h2>New recipe</h2>

      <form id="recipeForm">
        <label for="title">Title</label>
        <input type="text" id="title" required />

        <label for="ingredients">Ingredients, one per line</label>
        <textarea id="ingredients" required></textarea>

        <label for="steps">Steps, one per line</label>
        <textarea id="steps" required></textarea>

        <label for="tags">Tags, one per line</label>
        <textarea id="tags"></textarea>

        <label for="servings">Servings</label>
        <input type="number" id="servings" min="1" step="1" />

        <label for="timeMinutes">Time in minutes</label>
        <input type="number" id="timeMinutes" min="1" step="1" />

        <label>
          <input type="checkbox" id="isPublic" />
          Public recipe
        </label>

        <button type="submit" class="primary">Save recipe</button>
        <p id="msg"></p>
      </form>
    </section>
  </main>

  <script type="module" src="./src/ui/createRecipe.js"></script>
</body>
</html>
