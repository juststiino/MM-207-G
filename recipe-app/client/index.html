<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recipe book</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="/public/manifest.json" />
  <link rel="icon" href="/public/icon-192.png" />
</head>

<body>
  <header class="site-header">
    <img src="./public/icon-192.png" alt="Recipe book logo" class="logo" />
    <h1>Recipe book</h1>
  </header>

  <nav class="navbar">
    <a href="/index.html" class="navButton">Home</a>
    <a href="/login.html" class="navButton">Login</a>
    <a href="/createRecipe.html" class="navButton">Create recipe</a>
    <a href="/myRecipe.html" class="navButton">My recipes</a>
  </nav>

  <main>
    <section class="card">
        <h2>Public recipes</h2>
        <p id="msg" class="hint"></p>
        <p id="recipes-empty" class="hint" hidden>No public recipes yet.</p>
        <div id="recipeList"></div>
    </section>
  </main>

    <div class="modal" id="recipeModal" hidden>
      <div class="modal-backdrop" data-modal-close></div>

      <div
        class="modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="recipeModalTitle"
      >
        <div class="modal-header">
          <h2 id="recipeModalTitle">Recipe</h2>
          <button
            type="button"
            class="modal-close"
            data-modal-close
            aria-label="Close recipe"
          >
            ×
          </button>
        </div>

        <div class="modal-body" id="recipeModalBody"></div>
      </div>
    </div>  
  <script type="module" src="./src/ui/indexRecipes.js"></script>
</body>
</html>
