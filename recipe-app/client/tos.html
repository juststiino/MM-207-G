<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="pageTitle">Terms of Service</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <h1 id="tosTitle"></h1>

    <h3 id="tosUseTitle"></h3>
    <p id="tosUseText"></p>

    <h3 id="tosContentTitle"></h3>
    <p id="tosContentText"></p>
    <ul>
      <li id="tosContentPrivate"></li>
      <li id="tosContentPublic"></li>
    </ul>

    <h3 id="tosPublicTitle"></h3>
    <p id="tosPublicText"></p>

    <h3 id="tosConsentTitle"></h3>
    <p id="tosConsentText"></p>
  </main>

  <script type="module">
    import { loadTranslations, t } from "./src/modules/i18n.js";

    await loadTranslations();

    document.documentElement.lang = t("meta.lang");
    document.title = t("legal.tosTitle");

    document.getElementById("tosTitle").textContent = t("legal.tosTitle");
    document.getElementById("tosUseTitle").textContent = t("legal.tosUseTitle");
    document.getElementById("tosUseText").textContent = t("legal.tosUseText");

    document.getElementById("tosContentTitle").textContent = t("legal.tosContentTitle");
    document.getElementById("tosContentText").textContent = t("legal.tosContentText");
    document.getElementById("tosContentPrivate").textContent = t("legal.tosContentPrivate");
    document.getElementById("tosContentPublic").textContent = t("legal.tosContentPublic");

    document.getElementById("tosPublicTitle").textContent = t("legal.tosPublicTitle");
    document.getElementById("tosPublicText").textContent = t("legal.tosPublicText");

    document.getElementById("tosConsentTitle").textContent = t("legal.tosConsentTitle");
    document.getElementById("tosConsentText").textContent = t("legal.tosConsentText");
  </script>
</body>
</html>
