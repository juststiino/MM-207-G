<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recipe book</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="./public/manifest.json">
  <link rel="icon" href="./public/icon-192.png">
</head>
<body>
  <header class="site-header">
    <img src="./public/icon-192.png" alt="Recipe book logo" class="logo" />
    <h1>Recipe book</h1>
  </header>

  <nav class="navbar">
    <a href="/index.html" class="navButton">Home</a>
    <a href="/login.html" class="navButton">Login</a>
    <a href="/createRecipe.html" class="navButton">Create recipe</a>
    <a href="/myRecipe.html" class="navButton">My recipes</a>
  </nav>

  <main>
    <user-manager></user-manager>
  </main>

  <template id="user-manager-template">
    <section class="card">
      <h2>User</h2>

      <div data-view="logged-in" hidden>
        <p class="hint">
          Logged in as <strong data-username></strong>.
        </p>
        <button type="button" class="primary" data-delete>
          Delete account
        </button>
      </div>

      <div data-view="logged-out" class="row" hidden>
        <form data-login class="card">
          <h3>Login</h3>

          <label>
            Username
            <input name="username" autocomplete="username" required />
          </label>

          <label>
            Password
            <input name="password" type="password" autocomplete="current-password" required />
          </label>

          <button type="submit" class="primary">Login</button>
        </form>

        <form data-register class="card">
          <h3>Register</h3>

          <label>
            Username
            <input name="username" autocomplete="username" required />
          </label>

          <label>
            Password (min 6 chars)
            <input name="password" type="password" autocomplete="new-password" required />
          </label>

          <label>
            Terms of service consent
            <span class="inline">
              <input type="checkbox" name="tosAccepted" required />
              <span class="hint">
                I agree to the <a href="tos.html" data-legal="tos">Terms of Service</a>
                and <a href="privacy.html" data-legal="privacy">Privacy Policy</a>.
              </span>
            </span>
          </label>

          <button type="submit" class="primary">Register</button>
        </form>
      </div>

      <p class="error" data-error hidden>
        <strong>Error:</strong> <span data-error-text></span>
      </p>
    </section>
  </template>
  
  <div class="modal" id="legalModal" hidden>
    <div class="modal-backdrop" data-modal-close></div>

    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="legalTitle">
      <div class="modal-header">
        <h2 id="legalTitle">Document</h2>
        <button type="button" class="modal-close" data-modal-close aria-label="Close">
          ×
        </button>
      </div>

      <div class="modal-body" id="legalContent"></div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
