<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recipe book</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="./public/manifest.json">
  <link rel="icon" href="./public/icon-192.png">
</head>

<body>
  <header class="site-header">
    <img src="./public/icon-192.png" alt="Recipe book logo" class="logo" />
    <h1>Recipe book</h1>
  </header>

  <nav class="navbar">
    <a href="/index.html" class="navButton">Home</a>
    <a href="/login.html" class="navButton">Min side</a>
    <a href="/createRecipe.html" class="navButton">Create recipe</a>
    <a href="/myRecipe.html" class="navButton">My recipes</a>
  </nav>

  <main>
    <user-manager></user-manager>
  </main>

  <template id="user-manager-template">
    <section class="card">
      <h2>User</h2>
      <div data-view="logged-in" hidden>
        <p class="hint">
          Logged in as <strong data-username></strong>.
        </p>

        <div class="my-page-overview">
          <a href="/createRecipe.html" class="my-page-card" data-my-page-link="create">
            <span class="my-page-card-title">Create recipe</span>
            <span class="my-page-card-text">Create and save a new recipe.</span>
          </a>

          <a href="/myRecipe.html" class="my-page-card" data-my-page-link="recipes">
            <span class="my-page-card-title">My recipes</span>
            <span class="my-page-card-text">View, edit and manage your recipes.</span>
          </a>
        </div>

        <div class="account-actions">
          <button type="button" class="primary" data-logout>
            Log out
          </button>

          <button type="button" class="danger" data-delete>
            Delete account
          </button>
        </div>
      </div>

      <div data-view="logged-out" hidden>
        <form data-login class="card auth-panel">
          <h3>Login</h3>

          <label>
            Username
            <input name="username" autocomplete="username" required />
          </label>

          <label>
            Password
            <input name="password" type="password" autocomplete="current-password" required />
          </label>

          <button type="submit" class="primary">Login</button>

          <p class="auth-switch">
            <span data-register-prompt>Don't have a user?</span>
            <button type="button" class="auth-link-button" data-show-register>
              Register here
            </button>
          </p>
        </form>

        <form data-register class="card auth-panel" hidden>
          <h3>Register</h3>

          <label>
            Username
            <input name="username" autocomplete="username" required />
          </label>

          <label>
            Password (min 6 chars)
            <input name="password" type="password" autocomplete="new-password" required />
          </label>

          <label class="tos-consent">
            <input type="checkbox" name="tosAccepted" required />

            <span class="tos-consent-content">
              <span data-tos-label>Terms of service consent</span>

              <span class="hint legal-links">
                <a href="tos.html" target="_blank" rel="noopener noreferrer" data-legal-link="tos"></a>
                <span class="legal-separator">|</span>
                <a href="privacy.html" target="_blank" rel="noopener noreferrer" data-legal-link="privacy"></a>
              </span>
            </span>
          </label>

          <button type="submit" class="primary">Register</button>

          <p class="auth-switch">
            <span data-login-prompt>Already have a user?</span>
            <button type="button" class="auth-link-button" data-show-login>
              Log in here
            </button>
          </p>
        </form>
      </div>

      <p class="error" data-error hidden>
        <strong>Error:</strong> <span data-error-text></span>
      </p>
    </section>
  </template>

  <div class="modal" id="legalModal" hidden>
    <div class="modal-backdrop" data-modal-close></div>

    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="legalTitle">
      <div class="modal-header">
        <h2 id="legalTitle">Document</h2>
        <button type="button" class="modal-close" data-modal-close aria-label="Close">
          ×
        </button>
      </div>

      <div class="modal-body" id="legalContent"></div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
